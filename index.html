<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareChronicle — Patient Medical Record & Care Organization</title>
  <meta name="description" content="Organize the records. Preserve the story. Simplify the journey. Patient-owned health record platform.">
  
  <!-- FontAwesome Icons & Design System Stylesheet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app">
    <!-- Desktop Sidebar Navigation -->
    <aside class="sidebar" aria-label="Main Navigation">
      <div>
        <div class="brand-container">
          <div class="brand-logo" aria-hidden="true">
            <i class="fa-solid fa-heart-pulse"></i>
          </div>
          <div>
            <div class="brand-title">CareChronicle</div>
            <div class="brand-subtitle">Patient Medical Record</div>
          </div>
        </div>

        <ul class="nav-list">
          <li class="nav-item active">
            <button data-target="home-view">
              <i class="fa-solid fa-house"></i> Home
            </button>
          </li>
          <li class="nav-item">
            <button data-target="vault-view">
              <i class="fa-solid fa-folder-closed"></i> Medical Vault
            </button>
          </li>
          <li class="nav-item">
            <button data-target="timeline-view">
              <i class="fa-solid fa-timeline"></i> Care Timeline
            </button>
          </li>
          <li class="nav-item">
            <button data-target="appointments-view">
              <i class="fa-solid fa-calendar-check"></i> Appointments
            </button>
          </li>
          <li class="nav-item">
            <button data-target="packages-view">
              <i class="fa-solid fa-box-archive"></i> Action Packages
            </button>
          </li>
          <li class="nav-item">
            <button data-target="access-view">
              <i class="fa-solid fa-user-shield"></i> Access & Privacy
            </button>
          </li>
        </ul>
      </div>

      <!-- Active Patient Case Selector Card -->
      <div class="case-selector-card">
        <div class="case-header">
          <span>Active Patient Case</span>
          <i class="fa-solid fa-rotate" style="cursor: pointer;" title="Switch Case Profile" id="switchCaseBtn" tabIndex="0"></i>
        </div>
        <div class="case-name" id="currentCaseName">Aarav Mehta (Self)</div>
        <div class="case-condition" id="currentCaseCondition">Stage II Colon Adenocarcinoma</div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="search-bar-container">
          <i class="fa-solid fa-magnifying-glass text-muted" aria-hidden="true"></i>
          <input type="text" id="globalSearchInput" placeholder="Search records, lab values, providers..." aria-label="Search records">
        </div>

        <div style="display: flex; align-items: center; gap: 14px;">
          <button class="btn btn-primary btn-sm" onclick="utils.openModal('uploadModal')">
            <i class="fa-solid fa-upload"></i> Upload Record
          </button>
          <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--light-pink); color: var(--dark-pink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;">
            AM
          </div>
        </div>
      </header>

      <!-- Scrollable Views Container -->
      <main class="content-area">
        <section id="home-view" class="view-panel active"></section>
        <section id="vault-view" class="view-panel"></section>
        <section id="timeline-view" class="view-panel"></section>
        <section id="appointments-view" class="view-panel"></section>
        <section id="packages-view" class="view-panel"></section>
        <section id="access-view" class="view-panel"></section>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Mobile Navigation">
      <button data-target="home-view" class="active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </button>
      <button data-target="vault-view">
        <i class="fa-solid fa-folder-closed"></i>
        <span>Vault</span>
      </button>
      <button data-target="timeline-view">
        <i class="fa-solid fa-timeline"></i>
        <span>Timeline</span>
      </button>
      <button data-target="appointments-view">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Visits</span>
      </button>
      <button data-target="packages-view">
        <i class="fa-solid fa-box-archive"></i>
        <span>Packages</span>
      </button>
    </nav>
  </div>

  <!-- UPLOAD MODAL PLACEHOLDER -->
  <div class="modal-overlay" id="uploadModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 18px;">Upload Medical Record</h3>
        <i class="fa-solid fa-xmark modal-close" onclick="utils.closeModal('uploadModal')"></i>
      </div>
      <div style="border: 2px dashed var(--soft-pink); border-radius: var(--radius-lg); padding: 40px 20px; text-align: center; background: var(--ultra-light-pink);">
        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 40px; color: var(--primary-pink); margin-bottom: 12px;"></i>
        <h4 style="font-size: 16px; margin-bottom: 6px;">Document Ingestion Dropzone</h4>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Original files are encrypted & preserved. Document Intelligence OCR pipeline activates in Phase 2.</p>
        <button class="btn btn-primary btn-sm" onclick="utils.showToast('Upload Ingestion Pipeline ready for Phase 2'); utils.closeModal('uploadModal');">
          Simulate Document Upload
        </button>
      </div>
    </div>
  </div>

  <!-- Modular Scripts Loading Sequence -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>

  <!-- Module Renderers -->
  <script src="js/modules/home.js"></script>
  <script src="js/modules/vault.js"></script>
  <script src="js/modules/timeline.js"></script>
  <script src="js/modules/appointments.js"></script>
  <script src="js/modules/packages.js"></script>
  <script src="js/modules/access.js"></script>

  <!-- Main Controller -->
  <script src="js/app.js"></script>
</body>
</html>
